<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React Mini Project - Profile Card</title>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f5f6fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box;">
  <div id="root"></div>

  <script type="text/babel">
    function ProfileCard({ name, title, location, bio, skills }) {
      const [isStarred, setIsStarred] = React.useState(false);
      const [showFullBio, setShowFullBio] = React.useState(false);
      
      const [skillCounts, setSkillCounts] = React.useState(
        skills.reduce((acc, skill) => ({ ...acc, [skill.name]: skill.initialCount }), {})
      );

      const toggleStar = () => setIsStarred(!isStarred);
      const toggleBio = () => setShowFullBio(!showFullBio);

      const handleEndorse = (skillName) => {
        setSkillCounts((prev) => ({
          ...prev,
          [skillName]: prev[skillName] + 1
        }));
      };

      const getInitials = (fullName) => {
        return fullName
          .split(' ')
          .map((n) => n[0])
          .join('')
          .toUpperCase();
      };

      return (
        <div style={{
          background: '#ffffff',
          width: '100%',
          maxWidth: '380px',
          borderRadius: '16px',
          padding: '24px',
          boxShadow: '0 10px 30px rgba(0, 0, 0, 0.05)',
          position: 'relative',
          boxSizing: 'border-box'
        }}>
          {/* Top Bar: Badge & Star */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
            <span style={{
              backgroundColor: '#e6f4ea',
              color: '#137333',
              fontSize: '12px',
              fontWeight: '600',
              padding: '4px 10px',
              borderRadius: '12px',
              display: 'inline-flex',
              alignItems: 'center',
              gap: '6px'
            }}>
              <span style={{ width: '6px', height: '6px', backgroundColor: '#34a853', borderRadius: '50%' }}></span>
              Available for Work
            </span>

            <button 
              onClick={toggleStar} 
              style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '18px', color: isStarred ? '#f4b400' : '#ccc' }}
            >
              {isStarred ? '★' : '☆'}
            </button>
          </div>

          {/* Avatar & Main Info */}
          <div style={{ textAlign: 'center', marginBottom: '20px' }}>
            <div style={{
              width: '64px',
              height: '64px',
              borderRadius: '50%',
              backgroundColor: '#4f46e5',
              color: '#ffffff',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              fontSize: '20px',
              fontWeight: 'bold',
              margin: '0 auto 12px auto'
            }}>
              {getInitials(name)}
            </div>

            <h2 style={{ margin: '0 0 4px 0', fontSize: '20px', color: '#1f2937', fontWeight: '700' }}>{name}</h2>
            <p style={{ margin: '0 0 4px 0', fontSize: '13px', color: '#4f46e5', fontWeight: '600' }}>{title}</p>
            <p style={{ margin: 0, fontSize: '12px', color: '#6b7280' }}>📍 {location}</p>
          </div>

          {/* Expandable Bio Section */}
          <div style={{
            backgroundColor: '#f9fafb',
            padding: '12px 14px',
            borderRadius: '10px',
            border: '1px solid #f3f4f6',
            marginBottom: '20px'
          }}>
            <p style={{ margin: '0 0 6px 0', fontSize: '13px', color: '#4b5563', lineHeight: '1.4' }}>
              {showFullBio ? bio : `${bio.substring(0, 55)}...`}
            </p>
            <button 
              onClick={toggleBio}
              style={{ background: 'none', border: 'none', color: '#4f46e5', fontSize: '12px', fontWeight: '600', cursor: 'pointer', padding: 0 }}
            >
              {showFullBio ? 'Read Less ▲' : 'Read Full Bio ▼'}
            </button>
          </div>

          {/* Skills Endorsements Section */}
          <div style={{ marginBottom: '20px' }}>
            <p style={{ margin: '0 0 10px 0', fontSize: '11px', fontWeight: '700', color: '#9ca3af', letterSpacing: '0.5px' }}>
              ENDORSE SKILLS (USESTATE)
            </p>

            {skills.map((skill) => (
              <div key={skill.name} style={{
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
                backgroundColor: '#f9fafb',
                border: '1px solid #f3f4f6',
                borderRadius: '8px',
                padding: '10px 12px',
                marginBottom: '8px'
              }}>
                <span style={{ fontSize: '13px', fontWeight: '600', color: '#374151' }}>{skill.name}</span>
                <button
                  onClick={() => handleEndorse(skill.name)}
                  style={{
                    display: 'flex',
                    alignItems: 'center',
                    gap: '6px',
                    border: '1px solid #e5e7eb',
                    backgroundColor: '#ffffff',
                    borderRadius: '6px',
                    padding: '4px 10px',
                    cursor: 'pointer',
                    fontSize: '12px',
                    color: '#4b5563'
                  }}
                >
                  <span>👍</span>
                  <span>{skillCounts[skill.name]}</span>
                </button>
              </div>
            ))}
          </div>

          {/* Action Buttons */}
          <div style={{ display: 'flex', gap: '8px' }}>
            <button style={{
              flex: 1,
              backgroundColor: '#4f46e5',
              color: '#ffffff',
              border: 'none',
              borderRadius: '8px',
              padding: '12px',
              fontWeight: '600',
              fontSize: '13px',
              cursor: 'pointer'
            }}>
              Connect With Me
            </button>
            <button style={{
              backgroundColor: '#f9fafb',
              color: '#374151',
              border: '1px solid #e5e7eb',
              borderRadius: '8px',
              padding: '12px 16px',
              fontWeight: '600',
              fontSize: '13px',
              cursor: 'pointer'
            }}>
              Share
            </button>
          </div>
        </div>
      );
    }

    function App() {
      const profileData = {
        name: "Brikxen Tonny",
        title: "Frontend Engineer & React Developer",
        location: "Chennai, India",
        bio: "Passionate web developer specializing in high-performance React SPAs and clean interactive UI design.",
        skills: [
          { name: "React.js", initialCount: 18 },
          { name: "JavaScript", initialCount: 24 },
          { name: "CSS3 / Glassmorphism", initialCount: 15 }
        ]
      };

      return <ProfileCard {...profileData} />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
