<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brikxen Tonny - Portfolio Card</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body style="margin: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; background: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; color: #f8fafc;">
  <div id="root"></div>

  <script>
    const e = React.createElement;

    function DarkGlassCard(props) {
      const [liked, setLiked] = React.useState(false);
      const [skills, setSkills] = React.useState([
        { name: 'React.js', count: 18 },
        { name: 'JavaScript', count: 24 },
        { name: 'CSS3 / Glassmorphism', count: 15 }
      ]);

      const toggleLike = () => setLiked(!liked);

      const endorse = (index) => {
        setSkills(prev => prev.map((s, i) => i === index ? { ...s, count: s.count + 1 } : s));
      };

      return e('div', {
        style: {
          background: 'rgba(30, 41, 59, 0.7)',
          backdropFilter: 'blur(16px)',
          WebkitBackdropFilter: 'blur(16px)',
          border: '1px solid rgba(255, 255, 255, 0.1)',
          width: '100%',
          maxWidth: '390px',
          borderRadius: '24px',
          padding: '28px',
          boxShadow: '0 20px 40px rgba(0, 0, 0, 0.4)',
          boxSizing: 'border-box'
        }
      },
        // Banner Header
        e('div', {
          style: {
            display: 'flex',
            alignItems: 'center',
            gap: '16px',
            marginBottom: '20px'
          }
        },
          e('div', {
            style: {
              width: '56px',
              height: '56px',
              borderRadius: '16px',
              background: 'linear-gradient(135deg, #6366f1 0%, #a855f7 100%)',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              fontSize: '20px',
              fontWeight: '700',
              color: '#fff',
              boxShadow: '0 8px 16px rgba(99, 102, 241, 0.3)'
            }
          }, 'BT'),
          e('div', { style: { flex: 1 } },
            e('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
              e('h2', { style: { margin: 0, fontSize: '18px', fontWeight: '700', color: '#f8fafc' } }, props.name),
              e('span', { style: { width: '8px', height: '8px', borderRadius: '50%', background: '#22c55e' } })
            ),
            e('p', { style: { margin: '2px 0 0 0', fontSize: '12px', color: '#a855f7', fontWeight: '600' } }, props.title)
          ),
          e('button', {
            onClick: toggleLike,
            style: {
              background: liked ? 'rgba(239, 68, 68, 0.2)' : 'rgba(255, 255, 255, 0.05)',
              border: liked ? '1px solid #ef4444' : '1px solid rgba(255, 255, 255, 0.1)',
              borderRadius: '12px',
              padding: '8px 12px',
              color: liked ? '#ef4444' : '#94a3b8',
              cursor: 'pointer',
              fontSize: '14px',
              transition: 'all 0.2s'
            }
          }, liked ? '❤️' : '🤍')
        ),

        // Location & Bio Box
        e('div', {
          style: {
            background: 'rgba(15, 23, 42, 0.5)',
            border: '1px solid rgba(255, 255, 255, 0.05)',
            borderRadius: '16px',
            padding: '14px',
            marginBottom: '20px'
          }
        },
          e('p', { style: { margin: '0 0 6px 0', fontSize: '11px', color: '#64748b', textTransform: 'uppercase', letterSpacing: '0.5px' } }, '📍 ' + props.location),
          e('p', { style: { margin: 0, fontSize: '13px', color: '#cbd5e1', lineHeight: '1.5' } }, props.bio)
        ),

        // Skills Pill Grid
        e('div', { style: { marginBottom: '24px' } },
          e('p', { style: { margin: '0 0 12px 0', fontSize: '11px', fontWeight: '700', color: '#64748b', textTransform: 'uppercase', letterSpacing: '0.8px' } }, 'Skills & Endorsements'),
          e('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } },
            skills.map((s, idx) =>
              e('div', {
                key: s.name,
                style: {
                  display: 'flex',
                  justifyContent: 'space-between',
                  alignItems: 'center',
                  background: 'rgba(255, 255, 255, 0.03)',
                  border: '1px solid rgba(255, 255, 255, 0.08)',
                  borderRadius: '12px',
                  padding: '10px 14px'
                }
              },
                e('span', { style: { fontSize: '13px', color: '#e2e8f0', fontWeight: '500' } }, s.name),
                e('button', {
                  onClick: () => endorse(idx),
                  style: {
                    background: 'linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(168, 85, 247, 0.2) 100%)',
                    border: '1px solid rgba(168, 85, 247, 0.4)',
                    color: '#c084fc',
                    borderRadius: '8px',
                    padding: '4px 10px',
                    fontSize: '12px',
                    fontWeight: '600',
                    cursor: 'pointer'
                  }
                }, `🔥 ${s.count}`)
              )
            )
          )
        ),

        // Full Width Action Button
        e('button', {
          style: {
            width: '100%',
            background: 'linear-gradient(135deg, #6366f1 0%, #a855f7 100%)',
            border: 'none',
            borderRadius: '14px',
            padding: '14px',
            color: '#ffffff',
            fontWeight: '600',
            fontSize: '14px',
            cursor: 'pointer',
            boxShadow: '0 8px 20px rgba(99, 102, 241, 0.35)'
          }
        }, 'Get In Touch')
      );
    }

    function App() {
      return e(DarkGlassCard, {
        name: 'Brikxen Tonny',
        title: 'Frontend Engineer & React Developer',
        location: 'Chennai, India',
        bio: 'Passionate web developer specializing in high-performance React SPAs and modern glassmorphic UIs.'
      });
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>
